get_version:
  stage: .pre
  rules: # this will be needed by release only if tag is created
    - if: $CI_COMMIT_TAG
  script:
    - IDTRACKERAI_VERSION=$(grep -oP "version\s*=\s*['\"]\K[^'\"]+" pyproject.toml)
    - echo $IDTRACKERAI_VERSION
    - echo "IDTRACKERAI_VERSION=$IDTRACKERAI_VERSION" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

install:
  stage: test
  image: continuumio/miniconda3:latest
  script:
    - conda create -n idtrackerai_test python=3.11 pytorch torchvision -c pytorch
    - source activate idtrackerai_test
    - apt-get update
    - apt-get install -y g++ ffmpeg libsm6 libxext6
    - python -m pip install .
    - python -m pip install pytest
    - pytest tests/unit_test.py --junitxml=report.xml

checks:
  stage: test
  image: continuumio/miniconda3:latest
  script:
    - python -m pip install -U black[jupyter] flake8 isort
    - black . --check
    - isort . --check
    - flake8

pypi_release:
  stage: deploy
  image: continuumio/miniconda3:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - pip install -U twine build
    - python -m build .
    # only protected tags will have access to Twine variables (TWINE_USER and TWINE_PASSWORD)
    # to create a protected tag, name it like *-release
    - python -m twine upload dist/*

gitlab_release:
  stage: .post
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: get_version
      artifacts: true
    - job: pypi_release
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "running gitlab_release for version tag $CI_COMMIT_TAG, idtrackerai version $IDTRACKERAI_VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $IDTRACKERAI_VERSION
    description: "Automated GitLab release from tag $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Documentation"
          url: "https://idtracker.ai/en/$IDTRACKERAI_VERSION/"
        - name: "PyPI"
          url: "https://pypi.org/project/idtrackerai/$IDTRACKERAI_VERSION/"
          link_type: "package"
        - name: "Changelog"
          url: "https://idtracker.ai/en/$IDTRACKERAI_VERSION/user_guide/changelog.html"
