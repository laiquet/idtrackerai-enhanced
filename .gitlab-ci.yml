image: continuumio/miniconda3:latest

get_version:
  stage: .pre
  script:
    - echo "IDTRACKERAI_VERSION=v$(grep -oP "version\s*=\s*['\"]\K[^'\"]+" pyproject.toml)" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env

install:
  stage: test
  script:
    - conda create -n idtrackerai_test python=3.11 pytorch torchvision -c pytorch
    - source activate idtrackerai_test
    - apt-get update
    - apt-get install -y g++ ffmpeg libsm6 libxext6
    - python -m pip install .
    - python -m pip install pytest
    - pytest tests/unit_test.py --junitxml=report.xml

checks:
  stage: test
  needs:
    - job: get_version
      artifacts: true
  script:
    - echo $IDTRACKERAI_VERSION
    - python -m pip install -U black[jupyter] flake8 isort
    - black . --check
    - isort . --check
    - flake8

release:
  stage: deploy
  rules: # if a tag has been generated
    - if: $CI_COMMIT_TAG
  needs:
    - job: get_version
      artifacts: true
  script:
    - echo $VERSION
    - echo "https://pypi.org/project/idtrackerai/$VERSION/"
    - pip install -U twine build
    - pythasdon -m build .
    # only protected tags will have access to Twine variables (TWINE_USER and TWINE_PASSWORD)
    # to create a protected tag, name it like *-release
    - python -m twine upload dist/*
  release:
    tag_name: $VERSION
    description: "Automated GitLab release from $CI_COMMIT_TAG"
    assets:
      links:
        - name: "PyPI"
          url: "https://pypi.org/project/idtrackerai/$VERSION/"
          link_type: "package"
