image: continuumio/miniconda3:latest

install:
  stage: test
  script:
    - conda create -n idtrackerai_test python=3.11 pytorch torchvision -c pytorch
    - source activate idtrackerai_test
    - apt-get update
    - apt-get install -y g++ ffmpeg libsm6 libxext6
    - python -m pip install -U pip
    - python -m pip install .
    - python -m pip install pytest pylint pylint-exit anybadge
    - mkdir ./pylint
    - pylint --output-format=text src/ tests/ --rcfile=pyproject.toml| tee ./pylint/pylint.log || pylint-exit $?
    - PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' ./pylint/pylint.log)
    - anybadge --label=Pylint --file=pylint/pylint.svg --value=$PYLINT_SCORE 2=red 4=orange 8=yellow 10=green
    - echo "Pylint score is $PYLINT_SCORE"
    - pytest tests/unit_test.py --junitxml=report.xml

checks:
  stage: test
  script:
    - python -m pip install -U black[jupyter] flake8 isort
    - black . --check
    - isort . --check
    - flake8

release:
  stage: deploy
  rules: # if a tag has been generated in the default branch
    - if: $CI_COMMIT_TAG && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pip install -U twine build
    - python -m build .
    - python -m twine upload dist/*
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Automated GitLab release from $CI_COMMIT_TAG"
