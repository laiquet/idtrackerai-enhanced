image: continuumio/miniconda3:latest


install:
  stage: build
  script:
    - conda env create -f test-environment.yml
    - source activate idtrackerai_test
    - pip install .
    
pylint:
  stage: test
  before_script:
    - pip install pylint pylint-exit anybadge
  script:
    - mkdir ./pylint
    - pylint --output-format=text src/ tests/ --rcfile=pyproject.toml| tee ./pylint/pylint.log || pylint-exit $?
    - PYLINT_SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/.*/\1/p' ./pylint/pylint.log)
    - anybadge --label=Pylint --file=pylint/pylint.svg --value=$PYLINT_SCORE 2=red 4=orange 8=yellow 10=green
    - echo "Pylint score is $PYLINT_SCORE"
  artifacts:
    paths:
      - ./pylint/

unit_tests:
  stage: test
  before_script:
    - pip install pytest
  script:
    - pytest tests/unit_tests.py

black:
  stage: test
  before_script:
    - pip install black
  script:
    - black src --check

flake8:
  stage: test
  before_script:
    - pip install flake8
  script:
    - flake8 src --select=E5,E7,E9,W6,F63,F7,F82 --max-line-length=120 --show-source --statistics
